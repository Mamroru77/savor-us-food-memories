<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    box-sizing: border-box;
    background: linear-gradient(180deg, #dff1ff, #f7fbff);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  svg {
    width: min(92vw, 900px);
    height: auto;
    border-radius: 18px;
    box-shadow: 0 12px 40px rgba(30, 60, 90, .18);
    display: block;
  }
  p { margin: 0; color: #4a6a8a; font-size: 14px; letter-spacing: .08em; }
</style>
</head>
<body>

<svg viewBox="0 0 800 500" role="img" aria-label="一只鹈鹕骑着自行车"
     xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <title>鹈鹕骑自行车</title>
  <desc>一只戴头盔的鹈鹕正在骑红色自行车，车轮旋转、双腿蹬踏板、路边风景向后掠过。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0fa"/>
      <stop offset="1" stop-color="#eaf8ff"/>
    </linearGradient>

    <!-- 云朵 -->
    <g id="cloud">
      <ellipse cx="0"  cy="0"  rx="36" ry="16" fill="#ffffff"/>
      <ellipse cx="30" cy="-9" rx="26" ry="14" fill="#ffffff"/>
      <ellipse cx="58" cy="2"  rx="28" ry="12" fill="#ffffff"/>
      <ellipse cx="24" cy="6"  rx="40" ry="11" fill="#ffffff"/>
    </g>

    <!-- 树与灌木 -->
    <g id="tree">
      <rect x="-4" y="-30" width="8" height="30" rx="3" fill="#8d6748"/>
      <circle cx="-13" cy="-30" r="11" fill="#69b45c"/>
      <circle cx="13"  cy="-30" r="11" fill="#69b45c"/>
      <circle cx="0"   cy="-38" r="17" fill="#5aa64f"/>
    </g>
    <g id="bush">
      <ellipse cx="0"   cy="-10" rx="22" ry="13" fill="#5aa64f"/>
      <ellipse cx="-13" cy="-6"  rx="11" ry="8"  fill="#69b45c"/>
      <ellipse cx="12"  cy="-7"  rx="10" ry="8"  fill="#4c9a43"/>
    </g>

    <!-- 车轮（含旋转辐条） -->
    <g id="wheel">
      <circle cx="0" cy="0" r="64" fill="none" stroke="#2f3542" stroke-width="12"/>
      <circle cx="0" cy="0" r="56" fill="none" stroke="#b8c2cc" stroke-width="4"/>
      <g>
        <animateTransform attributeName="transform" attributeType="XML"
                          type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
        <line x1="-52" y1="0" x2="52" y2="0" stroke="#9aa5af" stroke-width="3"/>
        <line x1="0" y1="-52" x2="0" y2="52" stroke="#9aa5af" stroke-width="3"/>
        <line x1="-36.8" y1="-36.8" x2="36.8" y2="36.8" stroke="#9aa5af" stroke-width="3"/>
        <line x1="-36.8" y1="36.8"  x2="36.8" y2="-36.8" stroke="#9aa5af" stroke-width="3"/>
        <circle cx="0" cy="-50" r="3.5" fill="#6c757d"/>
      </g>
      <circle cx="0" cy="0" r="7" fill="#495057"/>
      <circle cx="0" cy="0" r="2.5" fill="#adb5bd"/>
    </g>
  </defs>

  <!-- ======== 背景 ======== -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- 太阳 -->
  <g transform="translate(690 84)">
    <g opacity=".8">
      <animateTransform attributeName="transform" attributeType="XML"
                        type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      <line x1="44" y1="0" x2="58" y2="0"  transform="rotate(0)"   stroke="#ffcf5c" stroke-width="5" stroke-linecap="round"/>
      <line x1="44" y1="0" x2="58" y2="0"  transform="rotate(45)"  stroke="#ffcf5c" stroke-width="5" stroke-linecap="round"/>
      <line x1="44" y1="0" x2="58" y2="0"  transform="rotate(90)"  stroke="#ffcf5c" stroke-width="5" stroke-linecap="round"/>
      <line x1="44" y1="0" x2="58" y2="0"  transform="rotate(135)" stroke="#ffcf5c" stroke-width="5" stroke-linecap="round"/>
      <line x1="44" y1="0" x2="58" y2="0"  transform="rotate(180)" stroke="#ffcf5c" stroke-width="5" stroke-linecap="round"/>
      <line x1="44" y1="0" x2="58" y2="0"  transform="rotate(225)" stroke="#ffcf5c" stroke-width="5" stroke-linecap="round"/>
      <line x1="44" y1="0" x2="58" y2="0"  transform="rotate(270)" stroke="#ffcf5c" stroke-width="5" stroke-linecap="round"/>
      <line x1="44" y1="0" x2="58" y2="0"  transform="rotate(315)" stroke="#ffcf5c" stroke-width="5" stroke-linecap="round"/>
    </g>
    <circle r="54" fill="#ffd166" opacity=".25"/>
    <circle r="36" fill="#ffd166"/>
  </g>

  <!-- 云朵（无缝滚动） -->
  <g opacity=".95">
    <animateTransform attributeName="transform" attributeType="XML"
                      type="translate" from="0 0" to="-1200 0" dur="42s" repeatCount="indefinite"/>
    <use xlink:href="#cloud" href="#cloud" x="150"  y="88"/>
    <g transform="translate(720 52) scale(.72)"><use xlink:href="#cloud" href="#cloud"/></g>
    <use xlink:href="#cloud" href="#cloud" x="1350" y="88"/>
    <g transform="translate(1920 52) scale(.72)"><use xlink:href="#cloud" href="#cloud"/></g>
  </g>

  <!-- 远山 -->
  <ellipse cx="170" cy="418" rx="250" ry="50" fill="#bfe0ac"/>
  <ellipse cx="560" cy="424" rx="310" ry="58" fill="#cde8bb"/>

  <!-- 草地与马路 -->
  <rect x="0" y="400" width="800" height="32" fill="#8fc978"/>
  <rect x="0" y="432" width="800" height="68" fill="#6f7d8c"/>
  <line x1="0" y1="433.5" x2="800" y2="433.5" stroke="#57636f" stroke-width="3"/>

  <!-- 路边树木（快速掠过） -->
  <g>
    <animateTransform attributeName="transform" attributeType="XML"
                      type="translate" from="0 0" to="-400 0" dur="1.1s" repeatCount="indefinite"/>
    <use xlink:href="#tree" href="#tree" x="60"   y="430"/>
    <use xlink:href="#bush" href="#bush" x="180"  y="430"/>
    <use xlink:href="#tree" href="#tree" x="300"  y="430"/>
    <use xlink:href="#bush" href="#bush" x="420"  y="430"/>
    <use xlink:href="#tree" href="#tree" x="560"  y="430"/>
    <use xlink:href="#bush" href="#bush" x="680"  y="430"/>
    <use xlink:href="#tree" href="#tree" x="860"  y="430"/>
    <use xlink:href="#bush" href="#bush" x="980"  y="430"/>
    <use xlink:href="#tree" href="#tree" x="1100" y="430"/>
    <use xlink:href="#bush" href="#bush" x="1220" y="430"/>
    <use xlink:href="#tree" href="#tree" x="1340" y="430"/>
  </g>

  <!-- 马路中线（滚动） -->
  <line x1="-160" y1="466" x2="960" y2="466" stroke="#f1f5f9" stroke-width="6"
        stroke-linecap="round" stroke-dasharray="50 110">
    <animate attributeName="stroke-dashoffset" from="0" to="160" dur="0.45s" repeatCount="indefinite"/>
  </line>

  <!-- 阴影 -->
  <ellipse cx="400" cy="437" rx="240" ry="11" fill="#2b2f36" opacity=".14"/>

  <!-- 速度线 -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round">
    <line x1="150" y1="205" x2="215" y2="205" opacity="0">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-80 0" dur="0.65s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.85;0" dur="0.65s" begin="0s" repeatCount="indefinite"/>
    </line>
    <line x1="110" y1="250" x2="185" y2="250" opacity="0">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-80 0" dur="0.65s" begin=".22s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.85;0" dur="0.65s" begin=".22s" repeatCount="indefinite"/>
    </line>
    <line x1="135" y1="295" x2="200" y2="295" opacity="0">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-80 0" dur="0.65s" begin=".44s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.85;0" dur="0.65s" begin=".44s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ======== 自行车 ======== -->
  <use xlink:href="#wheel" href="#wheel" x="250" y="360"/>
  <use xlink:href="#wheel" href="#wheel" x="550" y="360"/>

  <!-- 飞轮与链条 -->
  <circle cx="250" cy="360" r="9" fill="none" stroke="#495057" stroke-width="3"/>
  <line x1="257" y1="352" x2="384" y2="343" stroke="#495057" stroke-width="3" stroke-dasharray="5 4">
    <animate attributeName="stroke-dashoffset" from="0" to="-18" dur="0.3s" repeatCount="indefinite"/>
  </line>
  <line x1="257" y1="368" x2="384" y2="377" stroke="#495057" stroke-width="3" stroke-dasharray="5 4">
    <animate attributeName="stroke-dashoffset" from="0" to="18" dur="0.3s" repeatCount="indefinite"/>
  </line>

  <!-- 车架 -->
  <g stroke="#e63946" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M250 360 L390 360"/>
    <path d="M250 360 L338 262"/>
    <path d="M390 360 L338 252"/>
    <path d="M390 360 L527 268"/>
    <path d="M346 259 L531 257"/>
    <path d="M537 247 L529 271"/>
    <path d="M529 271 L550 360" stroke-width="7"/>
  </g>

  <!-- 车座 / 车把 / 车铃 -->
  <ellipse cx="334" cy="246" rx="21" ry="7" fill="#343a40" transform="rotate(-10 334 246)"/>
  <path d="M533 249 L524 228" stroke="#343a40" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M524 228 Q531 243 505 239" stroke="#343a40" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="505" cy="239" r="5" fill="#212529"/>
  <circle cx="536" cy="222" r="5.5" fill="#ffd166" stroke="#d9a520" stroke-width="1.5"/>
  <circle cx="536" cy="225" r="1.6" fill="#d9a520"/>

  <!-- 牙盘 -->
  <circle cx="390" cy="360" r="16" fill="none" stroke="#495057" stroke-width="4"/>
  <circle cx="390" cy="360" r="5" fill="#495057"/>

  <!-- 曲柄与踏板（旋转；踏板通过嵌套反向旋转始终保持水平） -->
  <g>
    <animateTransform attributeName="transform" attributeType="XML"
                      type="rotate" from="0 390 360" to="360 390 360" dur="1.2s" repeatCount="indefinite"/>
    <path d="M390 360 L350 360" stroke="#262b31" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(350 360)">
      <g>
        <animateTransform attributeName="transform" attributeType="XML"
                          type="rotate" from="0" to="-360" dur="1.2s" repeatCount="indefinite"/>
        <rect x="-12" y="-4" width="24" height="8" rx="3" fill="#343a40"/>
      </g>
    </g>
    <path d="M390 360 L430 360" stroke="#343a40" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(430 360)">
      <g>
        <animateTransform attributeName="transform" attributeType="XML"
                          type="rotate" from="0" to="-360" dur="1.2s" repeatCount="indefinite"/>
        <rect x="-12" y="-4" width="24" height="8" rx="3" fill="#212529"/>
      </g>
    </g>
  </g>

  <!-- ======== 鹈鹕 ======== -->
  <g>
    <!-- 远侧腿（相位差180°，8帧贴合踏板圆周轨迹） -->
    <path fill="none" stroke="#d1802a" stroke-width="8" stroke-linecap="round"
          d="M340 238 Q369 304 350 360">
      <animate attributeName="d" dur="1.2s" repeatCount="indefinite"
        keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
        values="M340 238 Q369 304 350 360;
                M340 238 Q376 295 362 332;
                M340 238 Q395 285 390 320;
                M340 238 Q414 295 418 332;
                M340 238 Q421 304 430 360;
                M340 238 Q414 321 418 388;
                M340 238 Q395 328 390 400;
                M340 238 Q376 321 362 388;
                M340 238 Q369 304 350 360"/>
    </path>
    <g>
      <animateTransform attributeName="transform" attributeType="XML"
                        type="rotate" from="180 390 360" to="540 390 360" dur="1.2s" repeatCount="indefinite"/>
      <g transform="translate(350 360)">
        <g>
          <animateTransform attributeName="transform" attributeType="XML"
                            type="rotate" from="0" to="-360" dur="1.2s" repeatCount="indefinite"/>
          <path d="M-9 -5 C0 -8 10 -6 15 -3 Q22 0 14 5 L-9 5 Q-14 0 -9 -5 Z" fill="#d1802a"/>
        </g>
      </g>
    </g>

    <!-- 身体（带轻微起伏） -->
    <g>
      <animateTransform attributeName="transform" attributeType="XML" type="translate"
                        values="0 0;0 -3;0 0" dur="0.6s" repeatCount="indefinite"/>

      <!-- 尾羽 -->
      <path d="M312 162 C290 146 274 130 266 114 C286 122 306 140 318 156 Z"
            fill="#fdfefe" stroke="#c8d0d9" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M318 172 C298 160 284 146 276 132 C294 142 312 158 322 168 Z"
            fill="#fdfefe" stroke="#c8d0d9" stroke-width="2.5" stroke-linejoin="round"/>

      <!-- 身体 -->
      <ellipse cx="345" cy="182" rx="76" ry="58" fill="#fdfefe" stroke="#c8d0d9" stroke-width="3"
               transform="rotate(-18 345 182)"/>
      <ellipse cx="330" cy="205" rx="45" ry="26" fill="#eef2f6" opacity=".8"
               transform="rotate(-18 330 205)"/>

      <!-- 脖子（描边管法） -->
      <path d="M398 152 C424 150 442 136 454 116 C460 105 466 99 474 95"
            fill="none" stroke="#c8d0d9" stroke-width="26" stroke-linecap="round"/>
      <path d="M398 152 C424 150 442 136 454 116 C460 105 466 99 474 95"
            fill="none" stroke="#fdfefe" stroke-width="21" stroke-linecap="round"/>

      <!-- 头 -->
      <circle cx="478" cy="92" r="27" fill="#fdfefe" stroke="#c8d0d9" stroke-width="3"/>

      <!-- 头盔 -->
      <path d="M450 90 A29 29 0 0 1 506 86 L450 92 Z"
            fill="#2a9d8f" stroke="#21867a" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M466 61 Q477 57 490 60 L487 88 Q477 86 468 88 Z" fill="#dff0ee" opacity=".85"/>

      <!-- 眼睛 -->
      <circle cx="486" cy="84" r="4.5" fill="#212529"/>
      <circle cx="487.5" cy="82.3" r="1.6" fill="#ffffff"/>

      <!-- 喉囊 -->
      <path d="M492 98 C500 132 520 148 550 142 C576 137 588 126 594 114 C566 121 528 118 492 98 Z"
            fill="#f8b25c" stroke="#e08a2e" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- 囊里的小鱼尾巴 -->
      <path d="M556 122 Q564 106 578 104 Q572 118 558 123 Z"
            fill="#5fb7dc" stroke="#3d8fb0" stroke-width="1.5" stroke-linejoin="round"/>

      <!-- 上喙 -->
      <path d="M490 80 C540 80 572 92 596 112 C560 103 520 99 490 97 Z"
            fill="#f6a94a" stroke="#d97b29" stroke-width="2" stroke-linejoin="round"/>
      <path d="M494 86 C536 87 566 96 586 108" fill="none" stroke="#d97b29" stroke-width="2" opacity=".8"/>

      <!-- 翅膀（扶车把） -->
      <path d="M362 156 C410 158 470 190 508 226 C515 233 512 243 503 242 C456 236 402 210 364 190 C350 182 350 165 362 156 Z"
            fill="#f2f6f9" stroke="#c8d0d9" stroke-width="3" stroke-linejoin="round"/>
      <path d="M452 196 Q470 208 490 224 M438 186 Q458 198 478 212"
            fill="none" stroke="#c8d0d9" stroke-width="2" opacity=".9"/>
    </g>

    <!-- 近侧腿（8帧贴合踏板圆周轨迹） -->
    <path fill="none" stroke="#f4a261" stroke-width="9" stroke-linecap="round"
          d="M344 240 Q415 306 430 360">
      <animate attributeName="d" dur="1.2s" repeatCount="indefinite"
        keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
        values="M344 240 Q415 306 430 360;
                M344 240 Q409 320 418 388;
                M344 240 Q395 326 390 400;
                M344 240 Q381 320 362 388;
                M344 240 Q375 306 350 360;
                M344 240 Q381 292 362 332;
                M344 240 Q395 286 390 320;
                M344 240 Q409 292 418 332;
                M344 240 Q415 306 430 360"/>
    </path>
    <g>
      <animateTransform attributeName="transform" attributeType="XML"
                        type="rotate" from="0 390 360" to="360 390 360" dur="1.2s" repeatCount="indefinite"/>
      <g transform="translate(430 360)">
        <g>
          <animateTransform attributeName="transform" attributeType="XML"
                            type="rotate" from="0" to="-360" dur="1.2s" repeatCount="indefinite"/>
          <path d="M-9 -5 C0 -8 10 -6 15 -3 Q22 0 14 5 L-9 5 Q-14 0 -9 -5 Z"
                fill="#f4a261" stroke="#d1802a" stroke-width="1.5"/>
        </g>
      </g>
    </g>
  </g>
</svg>

<p>🚲 一只鹈鹕正蹬着自行车兜风</p>

</body>
</html>
